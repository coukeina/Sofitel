<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sofitel Agadir</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <h1 class="logo">Sofitel</h1>

        <ul class="nav-links">
            <li>Home</li>
            <li>Experience</li>
            <li>Rooms</li>
            <li>Booking</li>
            <li>Contact</li>
        </ul>
    </nav>

    <!-- HERO SECTION -->
    <section class="hero">

        <!-- VIDEO -->
        <video autoplay muted loop id="bg-video">
            <source src="assets/videos/background.mp4" type="video/mp4">
        </video>

        <!-- OVERLAY -->
        <div class="overlay"></div>

        <!-- CONTENT -->
        <div class="hero-content">
            <h2>Experience Agadir</h2>
            <p>Discover more than a stay</p>
            <button>Book Now</button>
        </div>

    </section>

<section class="carousel">

    <div class="carousel-track">

        <div class="card active">
            <img src="assets/images/sunset.jpg">
            <h2>Sunsets of Agadir</h2>
        </div>

        <div class="card">
            <img src="assets/images/ocean.jpg">
            <h2>Ocean & Relaxation</h2>
        </div>

        <div class="card">
            <img src="assets/images/city.jpg">
            <h2>Discover the city</h2>
        </div>

    </div>

</section>
<script src="js/main.js"></script>

</body>
</html>
